<div class="chat-sidebar">

  <div class="sidebar-header">
    <h2>Conversas</h2>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Procurar uma conversa" />
  </div>

  <div class="chat-item" *ngFor="let user of users">

    <img [src]="user.photo" class="avatar" alt="Foto do usuário">

    <div class="chat-info">

      <div class="chat-top">
        <span class="name">
          {{ user.name }}
        </span>

        <span class="time">
          12:23
        </span>
      </div>

      <div class="chat-bottom">
        <span class="email">
          {{ user.email }}
        </span>
      </div>

    </div>

  </div>

</div>
