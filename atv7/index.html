<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IFPR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script>
        google.charts.load('current', { 'packages': ['geochart'] });
        google.charts.setOnLoadCallback(drawRegionsMap);

        function drawRegionsMap() {
            var data = google.visualization.arrayToDataTable([
                ['Country', 'Popularity'],
                ['Germany', 200],
                ['United States', 300],
                ['Brazil', 400],
                ['Canada', 500],
                ['France', 600],
                ['RU', 700]
            ]);

            var options = {
                colorAxis: { colors: ['#e0e0e0', '#000000'] },
                backgroundColor: '#f8f9fa',
                datalessRegionColor: '#dddddd',
                defaultColor: '#f5f5f5'
            };

            var chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
            chart.draw(data, options);
        }
    </script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-4 pt-0 pb-3 rounded-bottom-5">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-3">
                <span class="navbar-brand mb-0 h5">IFPR</span>

                <button class="btn btn-secondary position-relative">
                    Novos Dados
                    <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">57</span>
                </button>

                <select class="form-select w-auto">
                    <option>Anual</option>
                    <option>Semestral</option>
                    <option selected>Mensal</option>
                </select>
            </div>
            
            <!-- BOTÃO DO MAPA -->
            <button class="btn btn-light px-4 py-2 border" data-bs-toggle="offcanvas" data-bs-target="#mapaCanvas">
            </button>
            <div class="d-flex flex-column align-items-start text-white">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">Servidores</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label">Estudantes</label>
                </div>

                
            </div>
            <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#registroConceitos">
                Mais
            </button>
        </div>
    </nav>

    <!-- OFFCANVAS MAPA (SEM HEADER) -->
    <div class="offcanvas offcanvas-bottom" tabindex="-1" id="mapaCanvas" style="height: 80vh;">

        <!-- Header -->
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Mapa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <!-- Body -->
        <div class="offcanvas-body mt-5">

            <div id="regions_div" style="width: 100%; height: 100%;"></div>

        </div>

    </div>

    <!-- CONTEÚDO -->
    <div class="container-fluid mt-3">
        <div class="row g-3">

            <div class="col-md-2">
                <div class="card text-center mb-3">
                    <div class="card-body">
                        <h6>Conceito</h6>
                        <h2>B</h2>
                    </div>
                </div>

                <div class="card text-center mb-3">
                    <div class="card-body">
                        <h6>Frequência</h6>
                        <h4>89.5%</h4>
                    </div>
                </div>

                <div class="card text-center">
                    <div class="card-body">
                        <h6>Horas Afins</h6>
                        <h4>74</h4>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card mb-3">
                    <div class="card-body text-center">
                        <h6>Frequências</h6>
                        <div class="bg-secondary-subtle p-5 rounded">
                            GRÁFICO DE BARRAS
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body text-center">
                        <h6>Conceitos</h6>
                        <div class="bg-secondary-subtle p-5 rounded">
                            GRÁFICO DE PIZZA
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">Componente Curricular</div>
                    <table class="table mb-0">
                        <tr>
                            <td>Artes</td>
                            <td>89.5</td>
                        </tr>
                        <tr>
                            <td>Biologia</td>
                            <td>92.2</td>
                        </tr>
                        <tr>
                            <td>Desenvolvimento Web</td>
                            <td>78.5</td>
                        </tr>
                        <tr>
                            <td>Engenharia de Software</td>
                            <td>92.2</td>
                        </tr>
                        <tr>
                            <td>Geografia</td>
                            <td>95.8</td>
                        </tr>
                    </table>
                </div>

                <div class="card">
                    <div class="card-header">Conceitos</div>
                    <table class="table mb-0">
                        <tr>
                            <td>A</td>
                            <td>189</td>
                        </tr>
                        <tr>
                            <td>B</td>
                            <td>228</td>
                        </tr>
                        <tr>
                            <td>C</td>
                            <td>211</td>
                        </tr>
                        <tr>
                            <td>D</td>
                            <td>187</td>
                        </tr>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- OFFCANVAS LATERAL -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="registroConceitos">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">REGISTRO DE CONCEITOS</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <div class="card mb-3">
                <div class="card-body">
                    <label class="form-label">Disciplinas</label>
                    <select class="form-select" size="5">
                        <option>Artes</option>
                        <option selected>Biologia</option>
                        <option>Desenvolvimento Web</option>
                        <option>Engenharia de Software</option>
                        <option>Geografia</option>
                    </select>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <label class="form-label">Conceito</label>
                    <div class="form-check"><input class="form-check-input" type="radio" name="c"> A</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="c"> B</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="c" checked> C</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="c"> D</div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <label class="form-label">OBS.</label>
                    <textarea class="form-control"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
