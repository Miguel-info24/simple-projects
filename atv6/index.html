<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <title>Login - IFPR</title>
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            <div class="col d-flex align-items-center justify-content-center">
                <div class="ps-5 w-100" style="max-width: 400px;">

                    <header>
                        <h1>Login</h1>
                        <p>Bem-vindo! Por favor, faça login para continuar.</p>
                    </header>

                    <form class="border-bottom border-0 p-3">
                        <div class="mb-3">
                            <label for="e-mail" class="form-label mb-0 text-secondary">E-mail:</label>
                            <input type="email" class="form-control border-0 border-bottom rounded-0 p-0" id="e-mail" name="e-mail" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label mb-0 text-secondary">Senha:</label>
                            <input type="password" class="form-control border-0 border-bottom rounded-0 p-0" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-danger">logar</button>
                        <a href="#" class="btn text-secondary" style="margin-left: 40px;">Esqueceu a senha</a>
                    </form>
                    <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center mt-3 p-3 mt-3 me-3"
                        style="border-radius: 50%; width: 60px; height: 60px;">
                        <i class="bi bi-facebook fs-1"></i>
                    </div>
                    <div class="bg-danger  text-white d-inline-flex align-items-center justify-content-center p-3 mt-3 me-3"
                        style="border-radius: 50%; width: 60px; height: 60px;">
                        <i class="bi bi-google fs-1 text-light"></i>
                    </div>
                    <div class="bg-info  text-white d-inline-flex align-items-center justify-content-center p-3 mt-3 me-3"
                        style="border-radius: 50%; width: 60px; height: 60px;">
                        <i class="bi bi-twitter fs-1 text-light"></i>
                    </div>
                    <div class="bg-primary  text-white d-inline-flex align-items-center justify-content-center p-3 mt-3 me-3"
                        style="border-radius: 50%; width: 60px; height: 60px;">
                        <i class="bi bi-linkedin fs-1 text-light"></i>
                    </div>

                </div>
            </div>

            <div class="col d-none d-lg-block">
                <img src="img/logo_ifpr.jpg" alt="" class="img-fluid">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
