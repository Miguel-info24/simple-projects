<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoramento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="top-bar">
        <span id="data"></span>
        <h5>SISTEMA DE MONITORAMENTO DE EPIDEMIAS EMERGENTES</h5>
        <span id="hora"></span>
    </nav>

    <div class="covid-btn" data-bs-toggle="offcanvas" data-bs-target="#covidCanvas">
        <img src="img/covid.png" alt="" width="60">
        <span>COVID</span>
    </div>

    <div class="mpox-btn" data-bs-toggle="offcanvas" data-bs-target="#mpoxCanvas">
        <img src="img/mpox.png" alt="" width="60">
        <span>MPOX</span>
    </div>

    <div class="ebola-btn" data-bs-toggle="offcanvas" data-bs-target="#ebolaCanvas">
        <img src="img/ebola.png" alt="" width="60">
        <span>EBOLA</span>
    </div>

    <div id="barchart_material" style="height:400px; width: 800px; margin: 0 auto;"></div>

    <div class="offcanvas offcanvas-start" id="covidCanvas">
        <div class="offcanvas-header header-covid">
            <img src="img/covid.png" alt="" width="30">
            <h5>Informações: COVID</h5>
        </div>

        <div class="offcanvas-body">
            <h6 id="totalCovid"></h6>

            <div id="mapCovid" style="height:250px;"></div>

            <select id="selectCovid" class="form-control mt-3">
                <option value="Australia">Austrália</option>
                <option value="Brazil">Brasil</option>
                <option value="China">China</option>
                <option value="United States">Estados Unidos</option>
                <option value="Russia">Rússia</option>
            </select>

            <button onclick="addCaso('Covid')" class="btn btn-success mt-2">Registrar</button>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="mpoxCanvas">
        <div class="offcanvas-header header-mpox">
            <img src="img/mpox.png" alt="" width="30">
            <h5>Informações: MPOX</h5>
        </div>

        <div class="offcanvas-body">
            <h6 id="totalMpox"></h6>
            <div id="mapMpox" style="height:250px;"></div>

            <select id="selectMpox" class="form-control mt-3">
                <option value="Australia">Austrália</option>
                <option value="Brazil">Brasil</option>
                <option value="China">China</option>
                <option value="United States">Estados Unidos</option>
                <option value="Russia">Rússia</option>
            </select>

            <button onclick="addCaso('Mpox')" class="btn btn-danger mt-2">Registrar</button>
        </div>
    </div>

    <div class="offcanvas offcanvas-bottom" id="ebolaCanvas">
        <div class="offcanvas-header header-ebola">
            <img src="img/ebola.png" alt="" width="30">
            <h5>Informações: EBOLA</h5>
        </div>

        <div class="offcanvas-body">
            <h6 id="totalEbola"></h6>

            <div class="row">
                <div class="col-md-6">
                    <select id="selectEbola" class="form-control mt-3">
                        <option value="Australia">Austrália</option>
                        <option value="Brazil">Brasil</option>
                        <option value="China">China</option>
                        <option value="United States">Estados Unidos</option>
                        <option value="Russia">Rússia</option>
                    </select>

                    <button onclick="addCaso('Ebola')" class="btn btn-purple mt-2">Registrar</button>
                </div>

                <div class="col-md-6">
                    <div id="pieEbola"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
